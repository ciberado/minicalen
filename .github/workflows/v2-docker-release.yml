name: v2 Docker Release

on:
  push:
    tags:
      - 'v2-*-RELEASE'

env:
  REGISTRY: docker.io

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: v2/package-lock.json

      - name: Install dependencies
        working-directory: v2
        run: npm ci

      - name: Extract package versions
        id: versions
        working-directory: v2
        run: |
          FRONTEND_VERSION=$(node -p "require('./packages/frontend/package.json').version")
          SERVER_VERSION=$(node -p "require('./packages/server/package.json').version")
          echo "frontend_version=$FRONTEND_VERSION" >> $GITHUB_OUTPUT
          echo "server_version=$SERVER_VERSION" >> $GITHUB_OUTPUT
          echo "commit_sha=${GITHUB_SHA::8}" >> $GITHUB_OUTPUT

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push frontend image
        uses: docker/build-push-action@v5
        with:
          context: v2
          file: v2/packages/frontend/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/minicalen-v2-frontend:${{ steps.versions.outputs.frontend_version }}
            ${{ secrets.DOCKER_USERNAME }}/minicalen-v2-frontend:${{ steps.versions.outputs.commit_sha }}
            ${{ secrets.DOCKER_USERNAME }}/minicalen-v2-frontend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push server image
        uses: docker/build-push-action@v5
        with:
          context: v2
          file: v2/packages/server/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/minicalen-v2-server:${{ steps.versions.outputs.server_version }}
            ${{ secrets.DOCKER_USERNAME }}/minicalen-v2-server:${{ steps.versions.outputs.commit_sha }}
            ${{ secrets.DOCKER_USERNAME }}/minicalen-v2-server:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
