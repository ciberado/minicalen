services:
  minicalen:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - '8080:8080'
    environment:
      - NODE_ENV=production
      - BETTER_AUTH_SECRET=${BETTER_AUTH_SECRET:-change-me-change-me-change-me-change-me}
      - BETTER_AUTH_URL=${BETTER_AUTH_URL:-http://localhost:8080}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-http://localhost:8080}
    volumes:
      - minicalen-data:/app/data
    restart: unless-stopped

volumes:
  minicalen-data:
    driver: local
