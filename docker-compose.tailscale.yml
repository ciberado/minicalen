# Example deployment: a single all-in-one MiniCalen container joined to a
# Tailscale tailnet through a sidecar. Caddy running elsewhere on the tailnet
# (e.g. an EC2 with a public IP) can then reverse-proxy to http://minicalen:8080.
#
# No ports need to be published and no Tailscale Serve config is required: the
# node is reachable by name inside the tailnet.
#
# Copy `.env.example` to `.env`, fill it in, then:
#   docker compose -f docker-compose.tailscale.yml up -d

services:
  minicalen:
    image: ciberado/minicalen:${IMAGE_TAG:-latest}
    network_mode: service:minicalen-ts
    environment:
      - NODE_ENV=production
      - BETTER_AUTH_SECRET=${BETTER_AUTH_SECRET:?set BETTER_AUTH_SECRET}
      - BETTER_AUTH_URL=${BETTER_AUTH_URL:-https://minicalen.mininube.com}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-https://minicalen.mininube.com}
    volumes:
      - ${DATA_DIR:-/home/javi/services/minicalen/data}:/app/data
    depends_on:
      - minicalen-ts
    restart: unless-stopped

  minicalen-ts:
    hostname: minicalen
    container_name: minicalen_ts
    image: tailscale/tailscale:latest
    environment:
      - TS_AUTHKEY=${CLIENT_SECRET:?set CLIENT_SECRET}
      - TS_EXTRA_ARGS=${TS_EXTRA_ARGS:-}
      - TS_STATE_DIR=/var/lib/tailscale
    volumes:
      # Login state is persisted here. TS_AUTHKEY is only used on the first
      # login, so changing CLIENT_SECRET has no effect while this volume exists.
      # To re-authenticate with a new key: `docker compose down -v`.
      - tailscale-data-minicalen:/var/lib/tailscale
      - /dev/net/tun:/dev/net/tun
    # Uncomment to reach the app from the Docker host as well.
    # ports:
    #   - '8080:8080'
    cap_add:
      - net_admin
      - sys_module
    restart: unless-stopped

volumes:
  tailscale-data-minicalen:
    driver: local
